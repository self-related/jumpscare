                        Start

                    Exit Fullscreen
                </button>
            </div>
            
        </main>
        
        
        <script>
            // Classes ************************************************************************
            //
            class Controller {
                aborted = false;
    
                abort() {
                    this.aborted = true;
                }
            }
    
            class Counter {
                constructor(id, maxTime = 60) {
                    /**@type { HTMLParagraphElement } */
                    this.element = document.getElementById(id);
                    
                    if (!this.element) {
                        throw("Counter couldn't be constructed");
                    }
                    
                    this.value = Number(this.element.innerText);
                    this.maxTime = maxTime;
                }
                
                /**@param { number } newValue */
                updateHTML() {
                    this.element.innerText = this.value;
                }
                
                reset() {
                    this.controller?.abort();
                    this.controller = new Controller();  
    
                    this.value = 0;
                    this.updateHTML();
                }
                
                /**
                 * @param { number } until
                 * @param { function } fn
                 * @returns { Promise<boolean> }
                 */
                async count(until, fn) {
                    const currentController = this.controller;
                    
                    while (this.value < until) {
                        await new Promise(res => setTimeout(res, 1000));
                        
                        if (currentController.aborted) {
                            return false;
                        } else {
                            this.value++;
                            this.updateHTML();
    
                            // exec fn 2 seconds before the end
                            if (until - this.value === 2) {
                                fn();
                            }
                        }
                    }

                    this.reset();
    
                    return true;
                }
    
                getRandomTimeSec(maxTime) {
                    const minTime = 7;
                    let randomTime = Math.floor(Math.random() * maxTime) + minTime;

                    if (randomTime > maxTime) {
                        randomTime = minTime + randomTime - maxTime;
                    }
    
                    return randomTime;
                }
                
                start(fn) {
                    this.reset();
    
                    const randomTimeSec = this.getRandomTimeSec(this.maxTime); 
                    console.log("random time: " + randomTimeSec);
                    
                    this.count(randomTimeSec, fn);
                }
    
                // alias for reset for now
                stop() {
                    this.reset();
                }
            }
